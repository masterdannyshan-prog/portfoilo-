<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Project image placeholder</title>
  <desc id="description">A neutral placeholder to replace with a project image or video.</desc>
  <rect width="1600" height="900" fill="#eef0f2"/>
  <rect x="72" y="72" width="1456" height="756" rx="32" fill="#fff" stroke="#cfd4dc" stroke-width="4" stroke-dasharray="18 18"/>
  <circle cx="800" cy="390" r="72" fill="#e64a2e"/>
  <path d="M770 390h60M800 360v60" stroke="#fff" stroke-width="12" stroke-linecap="round"/>
  <text x="800" y="525" fill="#142033" font-family="Arial, sans-serif" font-size="42" font-weight="700" text-anchor="middle">Add project media</text>
  <text x="800" y="580" fill="#667085" font-family="Arial, sans-serif" font-size="26" text-anchor="middle">Replace this placeholder in the local editor</text>
</svg>
